# This portal alone, delivered through the host: it publishes no port and joins the
# external `platform` network, where the host proxies /remotes/products/ to port 80.
# The composition of the whole system lives in synkro-infra. Create the network first
# if it does not exist (`docker network create platform`) and run it with the values
# of a .env that is never committed:
#   docker compose --env-file .env -f deploy/compose.yml up --build
services:
  synkro-products-portal:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      args:
        VITE_BASE_PATH: /remotes/products/
        VITE_SHELL_ENTRY_URL: ${VITE_SHELL_ENTRY_URL:-http://localhost:5173/assets/remoteEntry.js}
    environment:
      HOST_ORIGIN: ${HOST_ORIGIN:-http://localhost:5173}
    expose: ["80"]
    networks: [platform]

networks:
  platform:
    external: true
